<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Evidence loop after model deployment</title>
  <desc id="desc">A diagram showing how deployed model behavior becomes monitored evidence.</desc>
  <rect width="1200" height="620" fill="#080b09"/>
  <rect x="46" y="42" width="1108" height="536" rx="10" fill="#0d120f" stroke="#243329"/>
  <text x="88" y="98" fill="#edf3ee" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Why monitoring still matters after training</text>
  <text x="88" y="132" fill="#a7b2aa" font-family="Inter, Arial, sans-serif" font-size="17">Training creates a model. Real-world use reveals where it is uncertain, brittle, or unsafe.</text>

  <g font-family="Inter, Arial, sans-serif">
    <circle cx="250" cy="322" r="92" fill="#111813" stroke="#2c3d32"/>
    <text x="205" y="306" fill="#9bd8b3" font-family="Consolas, monospace" font-size="13">INPUT</text>
    <text x="188" y="336" fill="#edf3ee" font-size="22" font-weight="700">Real world</text>
    <text x="184" y="362" fill="#a7b2aa" font-size="14">prompts, images, tools</text>

    <circle cx="500" cy="322" r="92" fill="#111813" stroke="#2c3d32"/>
    <text x="460" y="306" fill="#9bd8b3" font-family="Consolas, monospace" font-size="13">MODEL</text>
    <text x="452" y="336" fill="#edf3ee" font-size="22" font-weight="700">Behavior</text>
    <text x="433" y="362" fill="#a7b2aa" font-size="14">answers, detections, errors</text>

    <circle cx="750" cy="322" r="92" fill="#111813" stroke="#2c3d32"/>
    <text x="706" y="306" fill="#9bd8b3" font-family="Consolas, monospace" font-size="13">EVIDENCE</text>
    <text x="695" y="336" fill="#edf3ee" font-size="22" font-weight="700">Observed facts</text>
    <text x="690" y="362" fill="#a7b2aa" font-size="14">timestamps, outputs, sources</text>

    <circle cx="1000" cy="322" r="92" fill="#172018" stroke="#3b5140"/>
    <text x="956" y="306" fill="#b7c49b" font-family="Consolas, monospace" font-size="13">ACTION</text>
    <text x="944" y="336" fill="#edf3ee" font-size="22" font-weight="700">Improve or stop</text>
    <text x="935" y="362" fill="#a7b2aa" font-size="14">adjust, block, evaluate</text>

    <path d="M344 322H406" stroke="#6f8c78" stroke-width="2"/>
    <path d="M398 314l10 8-10 8" fill="none" stroke="#6f8c78" stroke-width="2"/>
    <path d="M594 322H656" stroke="#6f8c78" stroke-width="2"/>
    <path d="M648 314l10 8-10 8" fill="none" stroke="#6f8c78" stroke-width="2"/>
    <path d="M844 322H906" stroke="#6f8c78" stroke-width="2"/>
    <path d="M898 314l10 8-10 8" fill="none" stroke="#6f8c78" stroke-width="2"/>

    <path d="M1000 430C878 526 370 526 250 430" fill="none" stroke="#3e5445" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M258 443l-10-10 14-3" fill="none" stroke="#3e5445" stroke-width="2"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="116" y="176" width="968" height="48" rx="6" fill="#151b16" stroke="#2c3d32"/>
    <text x="142" y="206" fill="#c8b77b" font-family="Consolas, monospace" font-size="14">SIGNALWATCH focus:</text>
    <text x="306" y="206" fill="#a7b2aa" font-size="15">keep outputs traceable, surface missing data, and make failures visible.</text>

    <rect x="116" y="488" width="968" height="48" rx="6" fill="#151b16" stroke="#2c3d32"/>
    <text x="142" y="518" fill="#c8b77b" font-family="Consolas, monospace" font-size="14">Important:</text>
    <text x="242" y="518" fill="#a7b2aa" font-size="15">Monitoring does not prove a model is safe; it makes behavior inspectable and auditable.</text>
  </g>
</svg>
