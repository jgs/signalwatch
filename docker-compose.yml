services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalwatch
      POSTGRES_USER: signalwatch
      POSTGRES_PASSWORD: signalwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalwatch -d signalwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env.example
    environment:
      SIGNALWATCH_DATABASE_URL: postgresql://signalwatch:signalwatch@postgres:5432/signalwatch
      SIGNALWATCH_FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_SIGNALWATCH_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:

