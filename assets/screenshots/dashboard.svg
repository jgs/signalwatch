<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="SIGNALWATCH operational interface preview">
  <rect width="1440" height="860" fill="#040605"/>
  <rect x="0" y="0" width="286" height="860" fill="#050806"/>
  <line x1="286" y1="0" x2="286" y2="860" stroke="#1a2b21"/>
  <text x="30" y="54" fill="#d8ded9" font-family="Inter, Arial" font-size="22" font-weight="700">SIGNALWATCH</text>
  <text x="30" y="84" fill="#7f8b83" font-family="Consolas, monospace" font-size="12">EVIDENCE-AWARE OBSERVABILITY</text>
  <line x1="30" y1="114" x2="256" y2="114" stroke="#1a2b21"/>
  <g font-family="Consolas, monospace" font-size="12">
    <text x="30" y="154" fill="#536059">PUBLIC ROUTE</text>
    <text x="48" y="188" fill="#89e3ad">start</text>
    <text x="48" y="216" fill="#7f8b83">console</text>
    <text x="48" y="244" fill="#7f8b83">evidence ledger</text>
    <text x="48" y="272" fill="#7f8b83">perception lab</text>
    <text x="30" y="334" fill="#536059">BOUNDARIES</text>
    <text x="48" y="366" fill="#7f8b83">source-backed claims</text>
    <text x="48" y="394" fill="#7f8b83">runtime telemetry</text>
    <text x="48" y="422" fill="#7f8b83">real model outputs</text>
    <text x="48" y="450" fill="#7f8b83">unavailable states</text>
  </g>
  <rect x="326" y="34" width="1074" height="140" fill="#070a08" stroke="#1a2b21"/>
  <text x="354" y="70" fill="#89e3ad" font-family="Consolas, monospace" font-size="12">OPERATIONAL CONSOLE / TRUST BOUNDARY</text>
  <text x="354" y="118" fill="#d8ded9" font-family="Inter, Arial" font-size="30" font-weight="700">Inspect source-backed signals without invented telemetry.</text>
  <text x="354" y="150" fill="#7f8b83" font-family="Inter, Arial" font-size="15">Console, evidence ledger, methodology, and perception lab keep claims separate from runtime state.</text>
  <circle cx="1248" cy="98" r="5" fill="#89e3ad"/>
  <text x="1266" y="102" fill="#7f8b83" font-family="Consolas, monospace" font-size="12">LIVE WHEN BACKEND IS AVAILABLE</text>

  <g fill="#070a08" stroke="#1a2b21">
    <rect x="326" y="194" width="250" height="112"/>
    <rect x="594" y="194" width="250" height="112"/>
    <rect x="862" y="194" width="250" height="112"/>
    <rect x="1130" y="194" width="270" height="112"/>
  </g>
  <g font-family="Consolas, monospace">
    <text x="350" y="232" fill="#7f8b83" font-size="12">SOURCE CLAIMS</text><text x="350" y="270" fill="#d8ded9" font-size="24">real URLs only</text>
    <text x="618" y="232" fill="#7f8b83" font-size="12">COLLECTORS</text><text x="618" y="270" fill="#d8ded9" font-size="24">visible state</text>
    <text x="886" y="232" fill="#7f8b83" font-size="12">PERCEPTION</text><text x="886" y="270" fill="#d8ded9" font-size="24">model output</text>
    <text x="1154" y="232" fill="#7f8b83" font-size="12">UNAVAILABLE</text><text x="1154" y="270" fill="#d8ded9" font-size="24">not filled in</text>
  </g>

  <rect x="326" y="326" width="690" height="494" fill="#070a08" stroke="#1a2b21"/>
  <text x="350" y="362" fill="#d8ded9" font-family="Inter, Arial" font-size="17" font-weight="700">evidence-backed updates</text>
  <text x="812" y="362" fill="#7f8b83" font-family="Consolas, monospace" font-size="12">source items appear only with provenance</text>
  <g fill="#050706" stroke="#1a2b21">
    <rect x="350" y="386" width="642" height="126"/>
    <rect x="350" y="532" width="642" height="126"/>
    <rect x="350" y="678" width="642" height="116"/>
  </g>
  <g font-family="Inter, Arial">
    <text x="374" y="424" fill="#89e3ad" font-family="Consolas, monospace" font-size="12">SOURCE / LINK / TIMESTAMP</text>
    <text x="374" y="460" fill="#d8ded9" font-size="18" font-weight="700">Verified item title from an external source</text>
    <text x="374" y="488" fill="#aeb8b1" font-size="13">Summary, source type, authors, topics, and provenance remain attached.</text>
    <text x="374" y="570" fill="#89e3ad" font-family="Consolas, monospace" font-size="12">RUNTIME / COLLECTOR STATE</text>
    <text x="374" y="606" fill="#d8ded9" font-size="18" font-weight="700">Operational health is shown separately from claims</text>
    <text x="374" y="634" fill="#aeb8b1" font-size="13">Latency, reconnects, and heartbeats describe the app, not ecosystem facts.</text>
    <text x="374" y="716" fill="#89e3ad" font-family="Consolas, monospace" font-size="12">MODEL OUTPUT / PERCEPTION LAB</text>
    <text x="374" y="752" fill="#d8ded9" font-size="18" font-weight="700">Detection confidence is emitted by browser-side inference</text>
  </g>

  <rect x="1040" y="326" width="360" height="160" fill="#070a08" stroke="#1a2b21"/>
  <text x="1064" y="362" fill="#d8ded9" font-family="Inter, Arial" font-size="17" font-weight="700">inspect now</text>
  <text x="1064" y="402" fill="#89e3ad" font-family="Consolas, monospace" font-size="12">LATEST VERIFIED ITEM</text>
  <text x="1064" y="430" fill="#7f8b83" font-family="Consolas, monospace" font-size="12">COLLECTORS NEEDING ATTENTION</text>
  <text x="1064" y="458" fill="#7f8b83" font-family="Consolas, monospace" font-size="12">EVIDENCE GAPS</text>

  <rect x="1040" y="508" width="360" height="142" fill="#070a08" stroke="#1a2b21"/>
  <text x="1064" y="544" fill="#d8ded9" font-family="Inter, Arial" font-size="17" font-weight="700">trust boundary</text>
  <rect x="1064" y="578" width="292" height="6" fill="#89e3ad"/>
  <rect x="1064" y="610" width="210" height="6" fill="#6f8064"/>
  <text x="1064" y="636" fill="#7f8b83" font-family="Consolas, monospace" font-size="12">no fabricated confidence or telemetry</text>

  <rect x="1040" y="672" width="360" height="148" fill="#070a08" stroke="#1a2b21"/>
  <text x="1064" y="708" fill="#d8ded9" font-family="Inter, Arial" font-size="17" font-weight="700">public surfaces</text>
  <text x="1064" y="742" fill="#89e3ad" font-family="Consolas, monospace" font-size="12">/about</text>
  <text x="1162" y="742" fill="#7f8b83" font-family="Consolas, monospace" font-size="12">what this is and is not</text>
  <text x="1064" y="770" fill="#89e3ad" font-family="Consolas, monospace" font-size="12">/evidence</text>
  <text x="1162" y="770" fill="#7f8b83" font-family="Consolas, monospace" font-size="12">ledger of provenance</text>
</svg>
